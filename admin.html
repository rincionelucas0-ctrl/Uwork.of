<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Uwork Admin · Centro de control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#18212f;--muted:#687386;--line:#e5e9ef;--dark:#111827;--lime:#c8f36b;--red:#b42318;--green:#087443;--blue:#2457c5;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#27354c,transparent 35%),var(--dark)}
.login{width:min(440px,100%);background:white;border-radius:24px;padding:32px;box-shadow:0 24px 80px #0005}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:24px}.mark{width:42px;height:42px;background:var(--lime);border-radius:13px;display:grid;place-items:center;color:#17202d;font-weight:1000}.login h1{font-size:28px;line-height:1.15;margin:28px 0 8px}.muted{color:var(--muted)}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#7188b8;box-shadow:0 0 0 3px #2457c51a}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#edf0f4;color:#263246}.btn.primary{background:var(--dark);color:white}.btn.lime{background:var(--lime);color:#17202d}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.login .btn{width:100%;margin-top:18px;padding:13px}.error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}
.app{min-height:100vh}.top{height:68px;background:var(--dark);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.top .brand{font-size:19px}.top .mark{width:34px;height:34px;border-radius:10px}.top-right{display:flex;align-items:center;gap:14px}.top-right span{font-size:13px;color:#d0d6df}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 68px)}aside{padding:22px 14px;background:#fff;border-right:1px solid var(--line)}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#929bab;font-weight:800;padding:14px 12px 7px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#465267;font-weight:650;margin:2px 0}.nav.active,.nav:hover{background:#eff3e8;color:#1c2a13}.nav .ico{display:inline-block;width:25px}.main{padding:28px;min-width:0}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.heading h1{font-size:27px;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.stat .k{color:var(--muted);font-size:13px;font-weight:650}.stat .v{font-size:30px;font-weight:850;margin-top:7px;letter-spacing:-.04em}.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}.panel{margin-top:16px}.panel h2{font-size:17px;margin:0 0 14px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#778195}td strong{font-size:14px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eef1f5;color:#485366;font-size:11px;font-weight:750}.pill.green{background:#e8f7ef;color:var(--green)}.pill.red{background:#fff0ef;color:var(--red)}.pill.amber{background:#fff6df;color:#8a5a00}.actions{display:flex;gap:6px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar .field{max-width:300px}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:12px;background:#f1f5fb;color:#45536b;font-size:13px;margin:14px 0}.toast{position:fixed;bottom:22px;right:22px;background:#18212f;color:white;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0003;z-index:10;max-width:min(420px,calc(100vw - 44px))}
.modal-back{position:fixed;inset:0;background:#10182888;display:grid;place-items:center;padding:20px;z-index:9}.modal{width:min(600px,100%);max-height:85vh;overflow:auto;background:white;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px;padding:8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:4}.nav-label{display:none}.nav{white-space:nowrap;width:auto;padding:9px 11px}.main{padding:18px}.top{padding:0 14px}.top-right span{display:none}.heading h1{font-size:23px}.grid{gap:9px}.stat{padding:13px}.stat .v{font-size:25px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginView" class="login-wrap"><div class="login">
 <div class="brand"><div class="mark">U</div><span>Uwork <span style="font-weight:500;color:#718096">Admin</span></span></div>
 <h1>Centro de control</h1><p class="muted">Ingresá con la cuenta propietaria autorizada de Uwork.</p>
 <form id="loginForm"><label for="email">Correo electrónico</label><input id="email" class="field" type="email" autocomplete="username" required>
 <label for="password">Contraseña</label><input id="password" class="field" type="password" autocomplete="current-password" required>
 <button class="btn primary" type="submit">Ingresar al Admin</button><div id="loginError" class="error"></div></form>
 <p class="muted" style="font-size:12px;margin-top:16px">El acceso se valida contra el rol administrativo almacenado en Supabase. No hay registro público de administradores.</p>
 </div></section>
<section id="appView" class="app hidden">
 <header class="top"><div class="brand"><div class="mark">U</div><span>Uwork <span style="font-weight:450;color:#cbd5e1">Admin</span></span></div><div class="top-right"><span id="adminEmail"></span><button class="btn lime small" id="logoutBtn">Cerrar sesión</button></div></header>
 <div class="layout"><aside>
 <div class="nav-label">Principal</div>
 <button class="nav active" data-page="overview"><span class="ico">▦</span>Resumen</button>
 <button class="nav" data-page="users"><span class="ico">♙</span>Usuarios</button>
 <button class="nav" data-page="jobs"><span class="ico">▤</span>Empleos</button>
 <button class="nav" data-page="companies"><span class="ico">▣</span>Empleadores</button>
 <div class="nav-label">Moderación</div>
 <button class="nav" data-page="verifications"><span class="ico">✓</span>Verificaciones</button>
 <button class="nav" data-page="reports"><span class="ico">⚑</span>Denuncias</button>
 <div class="nav-label">Catálogos</div>
 <button class="nav" data-page="categories"><span class="ico">▧</span>Categorías</button>
 <button class="nav" data-page="neighborhoods"><span class="ico">⌖</span>Barrios</button>
 <div class="nav-label">Sistema</div>
 <button class="nav" data-page="audit"><span class="ico">◷</span>Auditoría</button>
 <button class="nav" data-page="settings"><span class="ico">⚙</span>Configuración</button>
 </aside><main class="main" id="content"><div class="empty">Cargando panel…</div></main></div>
</section>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://hngiowqqhbcjhetyeesk.supabase.co";
const SUPABASE_KEY="sb_publishable_Nd0-zCLfdRAhJrnvbCRGoQ_ps8acPb5";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentPage="overview",cache={};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>v?new Date(v).toLocaleString("es-AR"):"—";
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function pill(s){let k=["approved","published","resolved","accepted","verified"].includes(String(s).toLowerCase())?"green":["rejected","archived","dismissed","suspended"].includes(String(s).toLowerCase())?"red":["pending","open","investigating","reviewing"].includes(String(s).toLowerCase())?"amber":"";return `<span class="pill ${k}">${esc(s||"—")}</span>`}
function pageHead(title,desc,extra=""){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No hay registros para mostrar.</td></tr>`}</tbody></table></div>`}
async function log(action,target_table=null,target_id=null,details={}){if(!currentUser?.id)return;const {error}=await sb.from("admin_audit_logs").insert({admin_id:currentUser.id,action,target_table,target_id:target_id?String(target_id):null,details});if(error)console.warn("Audit log:",error.message)}
async function isOwner(){const {data,error}=await sb.from("admin_users").select("user_id,role").eq("user_id",currentUser.id).maybeSingle();if(error)throw error;return data?.role==="admin"}
async function boot(){try{const ok=await isOwner();if(!ok){await sb.auth.signOut();throw Error("Esta cuenta todavía no está habilitada como administradora propietaria.")}$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("adminEmail").textContent=currentUser.email||"";await render("overview")}catch(e){$("loginError").textContent=e.message; if(!$("appView").classList.contains("hidden")){$("appView").classList.add("hidden");$("loginView").classList.remove("hidden")}}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginError").textContent=error.message;return}currentUser=data.user;await boot()});
$("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();currentUser=null;$("appView").classList.add("hidden");$("loginView").classList.remove("hidden")});
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.page)}));
sb.auth.getSession().then(async({data})=>{if(data.session){currentUser=data.session.user;await boot()}});
sb.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;$("appView").classList.add("hidden");$("loginView").classList.remove("hidden")}});
async function fetchRows(table,select="*",order="created_at"){let q=sb.from(table).select(select);if(order)q=q.order(order,{ascending:false});const {data,error}=await q.limit(300);if(error)throw error;return data||[]}
async function render(page){currentPage=page;$("content").innerHTML='<div class="empty">Cargando…</div>';try{let out=await pages[page]();$("content").innerHTML=out;wirePageFilters(page)}catch(e){$("content").innerHTML=pageHead("No se pudo cargar", "Revisá permisos, políticas RLS y disponibilidad de la tabla.")+`<div class="notice">${esc(e.message)}</div>`}}
function wirePageFilters(page){
 const bind=(rootId,inputId,selectId=null,selectColumn=1)=>{const root=$(rootId),input=$(inputId),select=selectId?$(selectId):null;if(!root)return;const apply=()=>root.querySelectorAll("tbody tr").forEach(tr=>{const q=(input?.value||"").trim().toLocaleLowerCase("es"),v=select?.value||"",text=tr.textContent.toLocaleLowerCase("es");tr.hidden=!!(q&&!text.includes(q))||!!(v&&!((tr.children[selectColumn]?.textContent||"").toLowerCase().includes(v.toLowerCase())))});input?.addEventListener("input",apply);select?.addEventListener("change",apply)};
 if(page==="users")bind("usersTable","searchUsers");
 if(page==="jobs")bind("jobsTable","searchJobs","jobStatus",1);
 if(page==="companies")bind("companiesTable","searchCompanies","companyType",1);
 if(page==="verifications")bind("verificationsTable","searchVerifications","verificationStatus",2);
 if(page==="reports")bind("reportsTable","searchReports","reportStatus",2);
 if(page==="categories")bind("categoriesTable","searchCategories");
 if(page==="neighborhoods")bind("neighborhoodsTable","searchNeighborhoods","neighborhoodZone",1);
 if(page==="audit")bind("auditTable","searchAudit");
}
const pages={
async overview(){const [u,j,c,v,r]=await Promise.all([sb.from("profiles").select("id",{count:"exact",head:true}),sb.from("jobs").select("id",{count:"exact",head:true}),sb.from("companies").select("id",{count:"exact",head:true}),sb.from("verifications").select("id",{count:"exact",head:true}).eq("status","pending"),sb.from("reports").select("id",{count:"exact",head:true}).in("status",["open","investigating"])]);for(const x of [u,j,c,v,r])if(x.error)throw x.error;const [recentJobs,recentReports]=await Promise.all([fetchRows("jobs","id,title,status,created_at","created_at"),fetchRows("reports","id,reason,status,created_at","created_at")]);return pageHead("Resumen general","Estado operativo de Uwork en tiempo real")+`<div class="grid">${[["Usuarios",u.count??0,"Cuentas registradas"],["Empleos",j.count??0,"Publicaciones totales"],["Empleadores",c.count??0,"Perfiles de empleador"],["Verificaciones pendientes",v.count??0,"Requieren revisión"],["Denuncias abiertas",r.count??0,"Requieren moderación"]].map(x=>`<div class="stat"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join("")}</div><div class="two"><div class="panel"><h2>Empleos recientes</h2>${table(["Publicación","Estado","Fecha"],recentJobs.slice(0,7).map(x=>`<tr><td><strong>${esc(x.title)}</strong></td><td>${pill(x.status)}</td><td>${date(x.created_at)}</td></tr>`).join(""))}</div><div class="panel"><h2>Denuncias recientes</h2>${table(["Motivo","Estado"],recentReports.slice(0,7).map(x=>`<tr><td>${esc(x.reason)}</td><td>${pill(x.status)}</td></tr>`).join(""))}</div></div>`},
async users(){const rows=await fetchRows("profiles","id,full_name,account_kind,city,province,created_at");let authUsers=[];const authResult=await sb.functions.invoke("admin-manage-user",{body:{action:"list"}});if(!authResult.error&&!authResult.data?.error)authUsers=authResult.data?.users||[];const authById=new Map(authUsers.map(x=>[x.id,x]));const merged=rows.map(x=>({...x,...(authById.get(x.id)||{})}));cache.users=merged;return pageHead("Usuarios","Perfiles, estado de acceso y administración de cuentas",`<button class="btn primary" onclick="userCreateModal()">Crear usuario</button>`)+`<div class="toolbar"><input class="field" id="searchUsers" placeholder="Buscar por nombre, correo, ciudad o ID"><button class="btn" onclick="downloadCSV('users')">Exportar CSV</button></div><div class="notice">Se muestran hasta 300 perfiles recientes. El estado de acceso y las acciones de bloqueo se consultan mediante una función segura de servidor; la clave privilegiada nunca llega al navegador.${authResult.error?" Para habilitar estas acciones, desplegá admin-manage-user.":""}</div><div class="panel" id="usersTable">${table(["Usuario","Correo","Tipo","Ubicación","Acceso","Último ingreso","Acciones"],merged.map(x=>{const banned=!!(x.banned_until&&new Date(x.banned_until)>new Date());return `<tr><td><strong>${esc(x.full_name||"Sin nombre")}</strong><div class="muted"><code>${esc(x.id)}</code></div></td><td>${esc(x.email||"—")}</td><td>${pill(x.account_kind)}</td><td>${esc([x.city,x.province].filter(Boolean).join(", ")||"—")}</td><td>${authById.has(x.id)?pill(banned?"suspended":"active"):pill("unknown")}</td><td>${date(x.last_sign_in_at)}</td><td><div class="actions">${authById.has(x.id)?`<button class="btn small ${banned?"":"danger"}" onclick="manageUserAccess('${x.id}','${banned?"unban":"ban"}')">${banned?"Reactivar":"Bloquear"}</button>`:"—"}</div></td></tr>`}).join(""))}</div><div class="notice">El bloqueo es reversible y no elimina el perfil ni sus publicaciones. Para eliminar datos personales debe existir un procedimiento separado de baja y retención.</div>`},
async jobs(){const rows=await fetchRows("jobs","id,title,description,status,job_type,city,province,created_at,employer_id");cache.jobs=rows;return pageHead("Empleos","Revisión y moderación de publicaciones")+`<div class="toolbar"><input class="field" id="searchJobs" placeholder="Buscar empleo o ubicación"><select class="field" id="jobStatus"><option value="">Todos los estados</option>${["draft","published","paused","closed","archived"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="panel" id="jobsTable">${table(["Empleo","Estado","Modalidad","Ubicación","Publicado","Acciones"],rows.map(x=>`<tr><td><strong>${esc(x.title)}</strong></td><td>${pill(x.status)}</td><td>${esc(x.job_type)}</td><td>${esc([x.city,x.province].filter(Boolean).join(", "))}</td><td>${date(x.created_at)}</td><td><div class="actions"><button class="btn small" onclick="jobDetail('${x.id}')">Ver</button><button class="btn small" onclick="setJob('${x.id}','published')">Publicar</button><button class="btn small" onclick="setJob('${x.id}','paused')">Pausar</button><button class="btn small danger" onclick="setJob('${x.id}','archived')">Archivar</button></div></td></tr>`).join(""))}</div>`},
async companies(){const rows=await fetchRows("companies","id,name,description,employer_type,verified,public_location,created_at,owner_id");cache.companies=rows;return pageHead("Empleadores","Empresas, particulares y gestoras")+`<div class="toolbar"><input class="field" id="searchCompanies" placeholder="Buscar empleador, ubicación o ID"><select class="field" id="companyType"><option value="">Todos los tipos</option>${[...new Set(rows.map(x=>x.employer_type).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select><button class="btn" onclick="downloadCSV('companies')">Exportar CSV</button></div><div class="notice">Se muestran hasta 300 empleadores recientes. Los datos legales y de contacto privado no se consultan desde esta tabla.</div><div class="panel" id="companiesTable">${table(["Nombre","Tipo","Verificación","Ubicación pública","Alta","ID","Detalle"],rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${pill(x.employer_type)}</td><td>${pill(x.verified?"verified":"unverified")}</td><td>${esc(x.public_location||"—")}</td><td>${date(x.created_at)}</td><td><code>${esc(x.id)}</code></td><td><button class="btn small" onclick="companyDetail('${x.id}')">Ver ficha</button></td></tr>`).join(""))}</div>`},
async verifications(){const rows=await fetchRows("verifications","id,user_id,verification_type,status,document_path,created_at");cache.verifications=rows;return pageHead("Verificaciones","Revisión de identidad, empresas y gestoras")+`<div class="toolbar"><input class="field" id="searchVerifications" placeholder="Buscar por usuario o tipo"><select class="field" id="verificationStatus"><option value="">Todos los estados</option>${[...new Set(rows.map(x=>x.status).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select></div><div class="notice">Los documentos se mantienen privados. El enlace temporal se genera únicamente cuando un administrador pulsa para revisarlo.</div><div class="panel" id="verificationsTable">${table(["Usuario","Tipo","Estado","Enviada","Acciones"],rows.map(x=>`<tr><td><code>${esc(x.user_id)}</code></td><td>${pill(x.verification_type)}</td><td>${pill(x.status)}</td><td>${date(x.created_at)}</td><td><div class="actions"><button class="btn small" onclick="openVerification('${x.id}')">Ver documento</button><button class="btn small" onclick="setVerification('${x.id}','approved')" ${x.status==="approved"?"disabled":""}>Aprobar</button><button class="btn small danger" onclick="setVerification('${x.id}','rejected')" ${x.status==="rejected"?"disabled":""}>Rechazar</button></div></td></tr>`).join(""))}</div>`},
async reports(){const rows=await fetchRows("reports","id,reason,details,status,reporter_id,reported_user_id,job_id,created_at");cache.reports=rows;return pageHead("Denuncias","Seguimiento de reportes de usuarios y publicaciones")+`<div class="toolbar"><input class="field" id="searchReports" placeholder="Buscar motivo, detalle o ID"><select class="field" id="reportStatus"><option value="">Todos los estados</option>${[...new Set(rows.map(x=>x.status).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select><button class="btn" onclick="downloadCSV('reports')">Exportar CSV</button></div><div class="panel" id="reportsTable">${table(["Motivo","Detalle","Estado","Fecha","Acciones"],rows.map(x=>`<tr><td><strong>${esc(x.reason)}</strong></td><td>${esc(x.details||"—")}</td><td>${pill(x.status)}</td><td>${date(x.created_at)}</td><td><div class="actions"><button class="btn small" onclick="setReport('${x.id}','investigating')" ${x.status==="investigating"?"disabled":""}>Investigar</button><button class="btn small" onclick="setReport('${x.id}','resolved')" ${x.status==="resolved"?"disabled":""}>Resolver</button><button class="btn small danger" onclick="setReport('${x.id}','dismissed')" ${x.status==="dismissed"?"disabled":""}>Descartar</button></div></td></tr>`).join(""))}</div>`},
async categories(){const rows=await fetchRows("job_categories","id,name,slug",null);cache.categories=rows;return pageHead("Categorías y oficios","Catálogo que organiza las búsquedas de empleo",`<button class="btn primary" onclick="categoryModal()">Nueva categoría</button>`)+`<div class="toolbar"><input class="field" id="searchCategories" placeholder="Buscar categoría o slug"><button class="btn" onclick="downloadCSV('categories')">Exportar CSV</button></div><div class="notice">Al eliminar una categoría, los empleos vinculados conservan su publicación y quedan sin categoría.</div><div class="panel" id="categoriesTable">${table(["Nombre","Slug","ID","Acciones"],rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.slug)}</td><td><code>${esc(x.id)}</code></td><td><div class="actions"><button class="btn small" onclick="categoryModal('${x.id}')">Editar</button><button class="btn small danger" onclick="deleteCategory('${x.id}')">Eliminar</button></div></td></tr>`).join(""))}</div>`},
async neighborhoods(){const rows=await fetchRows("neighborhoods","id,source_key,name,zone,classification,centroid_latitude,centroid_longitude,source_name",null);cache.neighborhoods=rows;return pageHead("Barrios y zonas","Catálogo geográfico de Uwork",`<button class="btn primary" onclick="neighborhoodModal()">Nuevo barrio</button>`)+`<div class="toolbar"><input class="field" id="searchNeighborhoods" placeholder="Buscar barrio o fuente"><select class="field" id="neighborhoodZone"><option value="">Todas las zonas</option>${[...new Set(rows.map(x=>x.zone).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select><button class="btn" onclick="downloadCSV('neighborhoods')">Exportar CSV</button></div><div class="notice">Se permite crear y editar los registros. No se ofrece borrado para evitar romper empleos y preferencias vinculados.</div><div class="panel" id="neighborhoodsTable">${table(["Barrio","Zona","Clasificación","Fuente","Acciones"],rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${pill(x.zone)}</td><td>${esc(x.classification)}</td><td>${esc(x.source_name)}</td><td><button class="btn small" onclick="neighborhoodModal('${x.id}')">Editar</button></td></tr>`).join(""))}</div>`},
async audit(){const rows=await fetchRows("admin_audit_logs","id,admin_id,action,target_table,target_id,details,created_at");cache.audit=rows;return pageHead("Auditoría","Historial de acciones administrativas")+`<div class="toolbar"><input class="field" id="searchAudit" placeholder="Buscar acción, administrador o destino"><button class="btn" onclick="downloadCSV('audit')">Exportar CSV</button></div><div class="notice">Se muestran hasta 300 eventos recientes.</div><div class="panel" id="auditTable">${table(["Fecha","Administrador","Acción","Destino","Detalle"],rows.map(x=>`<tr><td>${date(x.created_at)}</td><td><code>${esc(x.admin_id)}</code></td><td><strong>${esc(x.action)}</strong></td><td>${esc(x.target_table||"—")} ${esc(x.target_id||"")}</td><td>${esc(JSON.stringify(x.details||{}))}</td></tr>`).join(""))}</div>`},
async settings(){return pageHead("Configuración","Estado de instalación y controles de seguridad")+`<div class="panel"><h2>Acceso administrativo</h2><p>El panel valida el rol <code>admin</code> en <code>admin_users</code>. La función <code>private.is_admin()</code> también exige ese rol; los moderadores no reciben privilegios de propietario.</p><p>Las operaciones de Auth usan funciones de servidor y nunca exponen <code>service_role</code> al navegador.</p></div><div class="panel"><h2>Funciones de servidor necesarias</h2><ul><li><code>admin-create-user</code>: alta de cuentas desde el panel.</li><li><code>admin-manage-user</code>: listado de estado Auth, bloqueo reversible y reactivación.</li></ul><p>Ambas deben estar desplegadas en Supabase para habilitar todas las operaciones de usuarios.</p></div><div class="panel"><h2>Permisos de catálogos</h2><p>La escritura de categorías requiere ejecutar <code>stage3_admin_catalog_permissions.sql</code>. Los barrios ya cuentan con políticas RLS de escritura para administradores; el SQL ajusta además los grants innecesarios.</p></div><div class="panel"><h2>Sin publicación automática</h2><p>Estos archivos son de trabajo. No se realizó ningún despliegue en Netlify ni Vercel.</p></div>`}
};
window.manageUserAccess=async(id,action)=>{const verb=action==="ban"?"bloquear":"reactivar";if(!confirm(`¿${verb.charAt(0).toUpperCase()+verb.slice(1)} esta cuenta?`))return;const {data,error}=await sb.functions.invoke("admin-manage-user",{body:{action,user_id:id}});if(error)return toast(error.message+". Verificá que admin-manage-user esté desplegada.");if(data?.error)return toast(data.error);await log(action==="ban"?"user_suspend":"user_reactivate","auth.users",id);toast(action==="ban"?"Cuenta bloqueada":"Cuenta reactivada");render("users")};
window.companyDetail=async(id)=>{const c=(cache.companies||[]).find(x=>x.id===id);if(!c)return toast("No se encontró el empleador");const {data:priv,error}=await sb.from("company_private").select("legal_name,contact_name,contact_phone,contact_email").eq("company_id",id).maybeSingle();if(error)return toast("No se pudieron consultar los datos privados: "+error.message);const owner=(cache.companies||[]).find(x=>x.id===id)?.owner_id;$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Ficha del empleador</h2><button class="btn" onclick="$('modalRoot').innerHTML=''">Cerrar</button></div><h3>${esc(c.name)}</h3><p>${pill(c.employer_type)} ${pill(c.verified?"verified":"unverified")}</p><div class="notice">Información pública</div><p><b>Descripción:</b> ${esc(c.description||"—")}</p><p><b>Ubicación pública:</b> ${esc(c.public_location||"—")}</p><p><b>Propietario:</b> <code>${esc(owner)}</code></p><div class="notice">Información privada · visible solo para administradores</div><p><b>Razón social:</b> ${esc(priv?.legal_name||"—")}</p><p><b>Contacto:</b> ${esc(priv?.contact_name||"—")}</p><p><b>Teléfono:</b> ${esc(priv?.contact_phone||"—")}</p><p><b>Email:</b> ${esc(priv?.contact_email||"—")}</p></div></div>`};
window.jobDetail=(id)=>{const j=(cache.jobs||[]).find(x=>x.id===id);if(!j)return toast("No se encontró el empleo");$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Detalle del empleo</h2><button class="btn" onclick="$('modalRoot').innerHTML=''">Cerrar</button></div><h3>${esc(j.title)}</h3><p>${pill(j.status)} ${pill(j.job_type)}</p><p>${esc(j.description||"Sin descripción")}</p><p><b>Ubicación:</b> ${esc([j.city,j.province].filter(Boolean).join(", "))}</p><p><b>Empleador:</b> <code>${esc(j.employer_id)}</code></p><p><b>Creado:</b> ${date(j.created_at)}</p><p><b>ID:</b> <code>${esc(j.id)}</code></p></div></div>`};
window.userCreateModal=()=>{$("modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Crear usuario</h2><button class="btn" onclick="$('modalRoot').innerHTML=''">Cerrar</button></div><label>Nombre completo</label><input id="newUserName" class="field" autocomplete="name" required><label>Correo electrónico</label><input id="newUserEmail" class="field" type="email" autocomplete="email" required><label>Contraseña inicial (mínimo 12 caracteres)</label><input id="newUserPassword" class="field" type="password" minlength="12" autocomplete="new-password" required><label>Tipo de cuenta</label><select id="newUserKind" class="field"><option value="worker">Trabajador</option><option value="employer">Empleador</option><option value="both">Ambas</option></select><p class="notice">La contraseña se entrega al usuario por un canal privado. No la compartas en este panel ni por canales públicos.</p><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="createAdminUser()">Crear cuenta</button></div></div></div>`};
window.createAdminUser=async()=>{const full_name=$("newUserName").value.trim(),email=$("newUserEmail").value.trim(),password=$("newUserPassword").value,account_kind=$("newUserKind").value;if(!full_name||!email||password.length<12)return toast("Completá los campos y usá una contraseña de al menos 12 caracteres");const button=document.querySelector("#modalRoot .btn.primary");if(button){button.disabled=true;button.textContent="Creando…"}const {data,error}=await sb.functions.invoke("admin-create-user",{body:{full_name,email,password,account_kind}});if(button){button.disabled=false;button.textContent="Crear cuenta"}if(error)return toast(error.message+". Verificá que admin-create-user esté desplegada en Supabase.");if(data?.error)return toast(data.error);await log("user_create","auth.users",data?.user?.id||null,{email,account_kind});$("modalRoot").innerHTML="";toast("Usuario creado correctamente");render("users")};
window.setJob=async(id,status)=>{if(!confirm(`¿Cambiar estado del empleo a ${status}?`))return;const {error}=await sb.from("jobs").update({status}).eq("id",id);if(error)return toast(error.message);await log("job_"+status,"jobs",id);toast("Empleo actualizado");render("jobs")};
window.openVerification=async(id)=>{const row=(cache.verifications||[]).find(x=>x.id===id);if(!row?.document_path)return toast("No se encontró el documento");const {data,error}=await sb.storage.from("uwork-private").createSignedUrl(row.document_path,60);if(error)return toast(error.message);if(!data?.signedUrl)return toast("No se pudo generar el enlace temporal");window.open(data.signedUrl,"_blank","noopener,noreferrer")};
window.setVerification=async(id,status)=>{if(!confirm(`¿${status==="approved"?"Aprobar":"Rechazar"} esta verificación?`))return;const row=(cache.verifications||[]).find(x=>x.id===id);const {error}=await sb.from("verifications").update({status,reviewed_by:currentUser.id,reviewed_at:new Date().toISOString()}).eq("id",id);if(error)return toast(error.message);if(row&&["business","agency"].includes(row.verification_type)){const {error:companyError}=await sb.from("companies").update({verified:status==="approved"}).eq("owner_id",row.user_id);if(companyError)return toast("Verificación guardada, pero no se pudo sincronizar el estado del empleador: "+companyError.message)}await log("verification_"+status,"verifications",id,{user_id:row?.user_id,verification_type:row?.verification_type});toast("Verificación actualizada");render("verifications")};
window.setReport=async(id,status)=>{if(!confirm(`¿Cambiar denuncia a ${status}?`))return;const {error}=await sb.from("reports").update({status}).eq("id",id);if(error)return toast(error.message);await log("report_"+status,"reports",id);toast("Denuncia actualizada");render("reports")};
window.neighborhoodModal=(id)=>{const x=(cache.neighborhoods||[]).find(r=>r.id===id)||{};$("modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>${id?"Editar barrio":"Nuevo barrio"}</h2><button class="btn" onclick="$('modalRoot').innerHTML=''">Cerrar</button></div><label>Clave de origen (única)</label><input id="nbKey" class="field" value="${esc(x.source_key||"")}" ${id?"readonly":""}><label>Nombre</label><input id="nbName" class="field" value="${esc(x.name||"")}"><div class="form-grid"><div><label>Zona</label><input id="nbZone" class="field" value="${esc(x.zone||"")}"></div><div><label>Clasificación</label><input id="nbClass" class="field" value="${esc(x.classification||"")}"></div><div><label>Latitud centroide</label><input id="nbLat" class="field" type="number" step="any" value="${x.centroid_latitude??""}"></div><div><label>Longitud centroide</label><input id="nbLon" class="field" type="number" step="any" value="${x.centroid_longitude??""}"></div></div><label>Fuente</label><input id="nbSource" class="field" value="${esc(x.source_name||"Administración Uwork")}"><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveNeighborhood('${id||""}')">Guardar barrio</button></div></div></div>`};
window.saveNeighborhood=async(id)=>{const source_key=$("nbKey").value.trim(),name=$("nbName").value.trim(),zone=$("nbZone").value.trim(),classification=$("nbClass").value.trim(),lat=Number($("nbLat").value),lon=Number($("nbLon").value),source_name=$("nbSource").value.trim();if(!source_key||!name||!zone||!classification||!$("nbLat").value||!$("nbLon").value||!Number.isFinite(lat)||!Number.isFinite(lon)||lat < -90||lat > 90||lon < -180||lon > 180)return toast("Completá todos los campos y coordenadas válidas");const payload={source_key,name,zone,classification,centroid_latitude:lat,centroid_longitude:lon,source_name};const q=id?sb.from("neighborhoods").update(payload).eq("id",id):sb.from("neighborhoods").insert(payload);const {error}=await q;if(error)return toast(error.message);await log(id?"neighborhood_update":"neighborhood_create","neighborhoods",id||source_key);$("modalRoot").innerHTML="";toast("Barrio guardado");render("neighborhoods")};
window.downloadCSV=(key)=>{const rows=cache[key]||[];if(!rows.length)return toast("No hay datos para exportar");const cols=Object.keys(rows[0]);const csv=[cols.join(","),...rows.map(r=>cols.map(c=>`"${String(r[c]??"").replace(/"/g,'""')}"`).join(","))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=`uwork-${key}.csv`;a.click();URL.revokeObjectURL(a.href)};
window.deleteCategory=async(id)=>{const row=(cache.categories||[]).find(x=>x.id===id);if(!row)return toast("No se encontró la categoría");if(!confirm(`¿Eliminar la categoría «${row.name}»? Los empleos vinculados quedarán sin categoría.`))return;const {error}=await sb.from("job_categories").delete().eq("id",id);if(error)return toast(error.message);await log("category_delete","job_categories",id,{name:row.name,slug:row.slug});toast("Categoría eliminada");render("categories")};
window.categoryModal=(id)=>{const x=(cache.categories||[]).find(r=>r.id===id)||{};$("modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>${id?"Editar categoría":"Nueva categoría"}</h2><button class="btn" onclick="$('modalRoot').innerHTML=''">Cerrar</button></div><label>Nombre</label><input id="catName" class="field" value="${esc(x.name||"")}"><label>Slug</label><input id="catSlug" class="field" value="${esc(x.slug||"")}"><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveCategory('${id||""}')">Guardar</button></div></div></div>`};
window.saveCategory=async(id)=>{const name=$("catName").value.trim(),slug=$("catSlug").value.trim();if(!name||!slug)return toast("Completá nombre y slug");const q=id?sb.from("job_categories").update({name,slug}).eq("id",id):sb.from("job_categories").insert({name,slug});const {error}=await q;if(error)return toast(error.message);await log(id?"category_update":"category_create","job_categories",id||slug);$("modalRoot").innerHTML="";toast("Categoría guardada");render("categories")};
</script></body></html>
